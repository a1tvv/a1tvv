# Рисует 3D-график коммитов для профиля. Запускается каждый день в 03:00 по Бишкеку (21:00 UTC),
# при пуше в main и вручную (Actions → Run workflow).
name: 3D contributions

on:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git commit -m "Обновить 3D-график коммитов"; then
            git push
          fi
